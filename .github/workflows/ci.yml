name: metrics
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: analytics_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: analytics_portfolio
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -panalytics_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: analytics_test
      MYSQL_DB: analytics_portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build and verify MySQL metrics
        run: |
          python -m scripts.run_pipeline
          python -m scripts.run_pipeline
          python -m scripts.verify_metrics
      - name: Verify committed Power BI data and definitions
        run: python -m scripts.verify_powerbi
      - name: Export and restore-test Desktop snapshot
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          python -m scripts.export_snapshot
          MYSQL_DB=analytics_portfolio_corrected python -m scripts.verify_metrics
      - name: Upload verified MySQL snapshot
        uses: actions/upload-artifact@v4
        with:
          name: marketing-corrected-mysql-snapshot
          path: |
            artifacts/marketing_corregido.sql
            artifacts/snapshot-validation.json
            artifacts/powerbi-validation.json
          if-no-files-found: error
          retention-days: 30


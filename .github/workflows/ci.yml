name: metrics
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: analytics_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: analytics_portfolio
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -panalytics_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: analytics_test
      MYSQL_DB: analytics_portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build and verify MySQL metrics
        run: |
          python -m scripts.run_pipeline
          python -m scripts.run_pipeline
          python -m scripts.verify_metrics
